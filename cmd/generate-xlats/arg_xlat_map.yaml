syscalls:
  access:
    mode: access_modes
  faccessat:
    mode: access_modes
  open:
    flags: open_mode_flags
  openat:
    flags: open_mode_flags
  faccessat2:
    mode: access_modes
  arch_prctl:
    option: archvals
  x86_xfeatures_table:
    # dummy for generation
    dummy: x86_xfeatures
  accept4:
    flags: sock_type_flags
  bpf:
    cmd: bpf_commands
  clock_adjtime:
    which_clock: clocknames
  clock_nanosleep:
    which_clock: clocknames
  clock_settime:
    which_clock: clocknames
  poll_table:
    dummy: pollflags
  epoll_table:
    dummy: epollevents
  epoll_ctl:
    op: epollctls
  epoll_create1:
    flags: epollflags
  mmap:
    prot: mmap_prot
    flags: mmap_flags
  mprotect:
    prot: mmap_prot
  mremap:
    flags: mremap_flags
  clone:
    clone_flags: clone_flags
  clone3:
    flags: clone3_flags
  futex:
    op: futexops
  madvise:
    behavior: madvise_cmds
  lseek:
    whence: whence_codes
  wait4:
    options: wait4_options
  umount2:
    flags: umount_flags
  mount:
    mountflags: mount_flags
  rt_sigprocmask:
    how: sigprocmaskcmds

# Custom mapping logic can be added later if needed.
# Note: open_mode_flags doesn't include access modes (O_RDONLY etc), 
# so the decoder logic will handle it using open_access_modes implicitly.
