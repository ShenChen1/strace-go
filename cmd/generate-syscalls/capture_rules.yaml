# Capture rules for strace-go BPF probes.
# offset is the offset within the str_arg[2048] buffer.
# type can be 'string' (bpf_probe_read_user_str) or 'raw' (bpf_probe_read_user).

rules:
  # Path-based syscalls (enter)
  - syscalls: [open, creat, access, chdir, chmod, chown, lchown, mkdir, rmdir, unlink, execve, swapon, swapoff, acct]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 512, type: string }]

  # Syscalls returning struct stat
  - syscalls: [stat, lstat]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 512, type: string }]
    exit:
      reads: [{ arg: 1, size: 144, offset: 1024, type: raw }]

  # FD-based fstat
  - syscalls: [fstat]
    exit:
      reads: [{ arg: 1, size: 144, offset: 1024, type: raw }]

  # At-based syscalls (enter)
  - syscalls: [openat, mkdirat, chmodat, fchmodat, faccessat, faccessat2, unlinkat, fchownat, readlinkat, linkat, symlinkat]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 512, type: string }]

  - syscalls: [newfstatat]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 512, type: string }]
    exit:
      reads: [{ arg: 2, size: 144, offset: 1024, type: raw }]

  - syscalls: [readlink]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 512, type: string }]
    exit:
      reads: [{ arg: 1, size: 512, offset: 1024, type: raw }]

  # Dual path syscalls
  - syscalls: [rename, link, symlink]
    enter:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 1, size: 512, offset: 512, type: string }

  - syscalls: [renameat, renameat2, linkat]
    enter:
      ptr_arg: 1
      reads:
        - { arg: 1, size: 512, offset: 0, type: string }
        - { arg: 3, size: 512, offset: 512, type: string }

  # Read/Write buffer capture (small prefix)
  - syscalls: [read, pread64]
    exit:
      ptr_arg: 1
      reads: [{ arg: 1, size: 512, offset: 1024, type: raw }]

  - syscalls: [write, pwrite64]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 512, offset: 0, type: raw }]

  # Network
  - syscalls: [connect, bind, sendto]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 128, offset: 0, type: raw }] # sockaddr

  - syscalls: [accept, accept4, getsockname, getpeername]
    exit:
      ptr_arg: 1
      reads: [{ arg: 1, size: 128, offset: 1024, type: raw }] # sockaddr

  - syscalls: [mount]
    enter:
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 1, size: 512, offset: 512, type: string }
        - { arg: 2, size: 128, offset: 1024, type: string }

  - syscalls: [umount2]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 512, type: string }]

  - syscalls: [io_submit]
    enter:
      reads: [{ arg: 2, size: 0, offset: 0, type: raw }]

  - syscalls: [io_cancel]
    enter:
      reads: [{ arg: 1, size: 64, offset: 0, type: raw }]

  - syscalls: [adjtimex]
    enter:
      reads: [{ arg: 0, size: 208, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 0, size: 208, offset: 1024, type: raw }]

  - syscalls: [clock_adjtime]
    enter:
      reads: [{ arg: 1, size: 208, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 1, size: 208, offset: 1024, type: raw }]

  - syscalls: [io_getevents, io_pgetevents]
    enter:
      ptr_arg: 4
      reads: [{ arg: 4, size: 16, offset: 512, type: raw }]
    exit:
      reads: [{ arg: 3, size: 0, offset: 1024, type: raw }]

  - syscalls: [clock_nanosleep]
    enter:
      reads: [{ arg: 2, size: 16, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 3, size: 16, offset: 1024, type: raw }]

  - syscalls: [clock_gettime]
    exit:
      ptr_arg: 1
      reads: [{ arg: 1, size: 16, offset: 1024, type: raw }]

  - syscalls: [gettimeofday]
    exit:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 16, offset: 1024, type: raw }
        - { arg: 1, size: 8, offset: 1040, type: raw }

  - syscalls: [poll]
    enter:
      reads: [{ arg: 0, size: 512, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 0, size: 512, offset: 1024, type: raw }]

  - syscalls: [select]
    enter:
      reads:
        - { arg: 1, size: 128, offset: 0, type: raw }
        - { arg: 2, size: 128, offset: 128, type: raw }
        - { arg: 3, size: 128, offset: 256, type: raw }
    exit:
      reads:
        - { arg: 1, size: 128, offset: 1024, type: raw }
        - { arg: 2, size: 128, offset: 1152, type: raw }
        - { arg: 3, size: 128, offset: 1280, type: raw }

  - syscalls: [epoll_ctl]
    enter:
      reads: [{ arg: 3, size: 12, offset: 0, type: raw }]

  - syscalls: [epoll_wait, epoll_pwait]
    exit:
      reads: [{ arg: 1, size: 512, offset: 1024, type: raw }]

  - syscalls: [rt_sigprocmask]
    enter:
      reads: [{ arg: 1, size: 8, offset: 0, type: raw }]

  # Keys
  - syscalls: [add_key, request_key]
    enter:
      reads:
        - { arg: 0, size: 64, offset: 0, type: string }
        - { arg: 1, size: 128, offset: 64, type: string }
        - { arg: 2, size: 256, offset: 256, type: raw }

  # AIO
  - syscalls: [io_setup]
    exit:
      ptr_arg: 1
      reads: [{ arg: 1, size: 8, offset: 1024, type: raw }]

  - syscalls: [arch_prctl]
    enter: { ptr_arg: 1 }
    exit:
      reads: [{ arg: 1, size: 8, offset: 1024, type: raw }]
