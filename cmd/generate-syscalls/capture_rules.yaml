# Capture rules for strace-go BPF probes.
# offset is the offset within the str_arg[2048] buffer.
# type can be 'string' (bpf_probe_read_user_str) or 'raw' (bpf_probe_read_user).

rules:
  # Path-based syscalls (enter)
  # IMPACT: Added fsopen to capture fs_name path string on enter.
  - syscalls: [open, creat, access, chdir, chroot, chmod, chown, lchown, mkdir, mknod, rmdir, unlink, execve, swapon, swapoff, acct, truncate, fsopen]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 4096, type: string }]

  - syscalls: [getcwd]
    exit:
      reads: [{ arg: 0, size: 0, offset: 1024, type: raw }]

  - syscalls: [uname]
    exit:
      reads: [{ arg: 0, size: 390, offset: 1024, type: raw }]

  # Syscalls returning struct stat
  - syscalls: [stat, lstat]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 512, type: string }]
    exit:
      reads: [{ arg: 1, size: 144, offset: 1024, type: raw }]

  # FD-based fstat
  - syscalls: [fstat]
    exit:
      reads: [{ arg: 1, size: 144, offset: 1024, type: raw }]

  # pipe/pipe2
  - syscalls: [pipe, pipe2]
    exit:
      reads: [{ arg: 0, size: 8, offset: 1024, type: raw }]

  # IMPACT: Capture socketpair fd array on exit so fd tracking does not read tracee memory in user space.
  - syscalls: [socketpair]
    exit:
      reads: [{ arg: 3, size: 8, offset: 1024, type: raw }]

  # At-based syscalls (enter)
  # IMPACT: Capture execveat along with other at-based syscalls for path resolution.
  # IMPACT: Added fspick to capture path string on enter.
  - syscalls: [openat, mkdirat, mknodat, chmodat, fchmodat, faccessat, faccessat2, unlinkat, fchownat, linkat, execveat, fspick]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 4096, type: string }]

  - syscalls: [openat2]
    enter:
      ptr_arg: 1
      reads:
        - { arg: 1, size: 4096, type: string }
        - { arg: 2, size: 0, offset: 4096, type: raw }

  # IMPACT: Set arg 3 (value) size to 4097 to capture complete paths within the 4504 StrArg limit.
  - syscalls: [fsconfig]
    enter:
      ptr_arg: 2
      reads:
        - { arg: 2, size: 257, offset: 0, type: string }
        - { arg: 3, size: 0, offset: 257, type: raw }

  - syscalls: [utimensat]
    enter:
      ptr_arg: 1
      reads:
        - { arg: 1, size: 512, offset: 0, type: string }
        - { arg: 2, size: 32, offset: 512, type: raw }

  - syscalls: [memfd_create]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 250, offset: 0, type: raw }]

  - syscalls: [utime]
    enter:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 1, size: 16, offset: 512, type: raw }

  - syscalls: [utimes]
    enter:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 1, size: 32, offset: 512, type: raw }

  - syscalls: [futimesat]
    enter:
      ptr_arg: 1
      reads:
        - { arg: 1, size: 512, offset: 0, type: string }
        - { arg: 2, size: 32, offset: 512, type: raw }

  - syscalls: [newfstatat]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 512, type: string }]
    exit:
      reads: [{ arg: 2, size: 144, offset: 1024, type: raw }]

  - syscalls: [readlink]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 512, type: string }]
    exit:
      reads: [{ arg: 1, size: 0, offset: 1024, type: raw }]

  - syscalls: [readlinkat]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 512, type: string }]
    exit:
      reads: [{ arg: 2, size: 0, offset: 1024, type: raw }]

  # Dual path syscalls
  - syscalls: [rename, link, symlink]
    enter:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 1, size: 512, offset: 512, type: string }

  - syscalls: [symlinkat]
    enter:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 2, size: 512, offset: 512, type: string }

  - syscalls: [renameat, renameat2, linkat]
    enter:
      ptr_arg: 1
      reads:
        - { arg: 1, size: 512, offset: 0, type: string }
        - { arg: 3, size: 512, offset: 512, type: string }

  # Read/Write buffer capture (small prefix)
  - syscalls: [read, pread64]
    exit:
      ptr_arg: 1
      payloads:
        - { arg: 1, kind: bytes, direction: out, len_from_ret: true, max: 512, offset: 1024 }

  - syscalls: [write, pwrite64]
    enter:
      ptr_arg: 1
      payloads:
        - { arg: 1, kind: bytes, direction: in, len_from_arg: 2, max: 512, offset: 0 }

  - syscalls: [readv, writev, preadv, pwritev, preadv2, pwritev2, vmsplice]
    enter:
      reads: [{ arg: 1, size: 0, offset: 0, type: raw }]

  - syscalls: [process_vm_readv, process_vm_writev]
    enter:
      reads:
        - { arg: 1, size: 0, offset: 0, type: raw }
        - { arg: 3, size: 0, offset: 512, type: raw }

  - syscalls: [process_madvise]
    enter:
      reads: [{ arg: 1, size: 0, offset: 0, type: raw }]

  - syscalls: [sendfile]
    enter:
      reads: [{ arg: 2, size: 8, offset: 512, type: raw }]
    exit:
      reads: [{ arg: 2, size: 8, offset: 1024, type: raw }]

  - syscalls: [copy_file_range]
    enter:
      reads:
        - { arg: 1, size: 8, offset: 512, type: raw }
        - { arg: 3, size: 8, offset: 520, type: raw }

  # Network
  - syscalls: [connect, bind]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 128, offset: 0, type: raw }] # sockaddr

  - syscalls: [sendto]
    enter:
      ptr_arg: 1
      reads: 
        - { arg: 1, size: 512, offset: 0, type: raw }    # buf
        - { arg: 4, size: 128, offset: 512, type: raw }  # addr

  - syscalls: [recvfrom]
    enter:
      reads: [{ arg: 5, size: 4, offset: 768, type: raw }] # addrlen in
    exit:
      ptr_arg: 1
      reads:
        - { arg: 1, size: 512, offset: 1024, type: raw } # buf
        - { arg: 4, size: 0, offset: 1536, type: raw } # addr
        - { arg: 5, size: 4, offset: 772, type: raw }   # addrlen out

  - syscalls: [accept, accept4, getsockname, getpeername]
    enter:
      reads: [{ arg: 2, size: 4, offset: 768, type: raw }] # addrlen in
    exit:
      ptr_arg: 1
      reads:
        - { arg: 1, size: 0, offset: 1024, type: raw } # addr out
        - { arg: 2, size: 4, offset: 772, type: raw } # addrlen out

  - syscalls: [bpf]
    enter:
      reads: [{ arg: 1, size: 0, offset: 0, type: raw }] # attr

  - syscalls: [ioctl]
    enter:
      ptr_arg: 2
      reads: [{ arg: 2, size: 0, offset: 512, type: raw }] # arg with dynamic size from cmd (arg 1)
    exit:
      reads: [{ arg: 2, size: 0, offset: 1024, type: raw }]

  - syscalls: [mount]
    enter:
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 1, size: 512, offset: 512, type: string }
        - { arg: 2, size: 128, offset: 1024, type: string }
        - { arg: 4, size: 512, offset: 1152, type: string } # data

  - syscalls: [umount2]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 512, type: string }]

  - syscalls: [epoll_ctl]
    enter:
      reads: [{ arg: 3, size: 12, offset: 0, type: raw }] # event

  - syscalls: [rt_sigaction]
    enter:
      reads: [{ arg: 1, size: 32, offset: 0, type: raw }] # act
    exit:
      reads: [{ arg: 2, size: 32, offset: 1024, type: raw }] # oact

  - syscalls: [prctl]
    enter:
      reads: [{ arg: 1, size: 16, offset: 0, type: string }]
    exit:
      reads: [{ arg: 1, size: 16, offset: 1024, type: raw }]

  - syscalls: [clone3]
    enter:
      reads: [{ arg: 0, size: 0, offset: 0, type: raw }] # uargs with dynamic size arg 1

  - syscalls: [io_submit]
    enter:
      reads: [{ arg: 2, size: 0, offset: 0, type: raw }]

  - syscalls: [io_cancel]
    enter:
      reads: [{ arg: 1, size: 64, offset: 0, type: raw }]

  - syscalls: [adjtimex]
    enter:
      reads: [{ arg: 0, size: 208, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 0, size: 208, offset: 1024, type: raw }]

  - syscalls: [clock_adjtime]
    enter:
      reads: [{ arg: 1, size: 208, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 1, size: 208, offset: 1024, type: raw }]

  - syscalls: [cachestat]
    enter:
      reads: [{ arg: 1, size: 16, offset: 512, type: struct }]
    exit:
      reads: [{ arg: 2, size: 40, offset: 1024, type: struct }]

  - syscalls: [capget]
    enter:
      reads: [{ arg: 0, size: 8, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 1, size: 24, offset: 1024, type: raw }]

  - syscalls: [capset]
    enter:
      reads: [{ arg: 0, size: 8, offset: 0, type: raw }]

  - syscalls: [io_getevents, io_pgetevents]
    enter:
      reads:
        - { arg: 4, size: 16, offset: 512, type: raw }
        - { arg: 5, size: 16, offset: 528, type: raw }
        - { arg: 5, size: 8, offset: 544, type: double_ptr }
    exit:
      reads: [{ arg: 3, size: 0, offset: 1024, type: raw }]

  - syscalls: [clock_nanosleep]
    enter:
      reads: [{ arg: 2, size: 16, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 3, size: 16, offset: 1024, type: raw }]

  - syscalls: [futex]
    enter:
      reads: [{ arg: 3, size: 16, offset: 0, type: raw }]

  - syscalls: [futex_wait]
    enter:
      reads: [{ arg: 4, size: 16, offset: 0, type: raw }]

  - syscalls: [futex_waitv]
    enter:
      reads:
        - { arg: 0, size: 0, offset: 0, type: raw }
        - { arg: 3, size: 16, offset: 3072, type: raw }

  - syscalls: [futex_requeue]
    enter:
      reads: [{ arg: 0, size: 48, offset: 0, type: raw }]

  - syscalls: [nanosleep]
    enter:
      reads: [{ arg: 0, size: 16, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 1, size: 16, offset: 1024, type: raw }]


  - syscalls: [clock_gettime, clock_getres]
    exit:
      ptr_arg: 1
      reads: [{ arg: 1, size: 16, offset: 1024, type: raw }]

  - syscalls: [clock_settime]
    enter:
      reads: [{ arg: 1, size: 16, offset: 0, type: raw }]

  - syscalls: [gettimeofday]
    exit:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 16, offset: 1024, type: raw }
        - { arg: 1, size: 8, offset: 1040, type: raw }

  - syscalls: [settimeofday]
    enter:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 16, offset: 0, type: raw }
        - { arg: 1, size: 8, offset: 16, type: raw }

  - syscalls: [poll]
    enter:
      reads: [{ arg: 0, size: 0, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 0, size: 0, offset: 1024, type: raw }]

  - syscalls: [ppoll]
    enter:
      reads:
        - { arg: 0, size: 0, offset: 0, type: raw }
        - { arg: 2, size: 16, offset: 512, type: raw } # timeout
    exit:
      reads:
        - { arg: 0, size: 0, offset: 1024, type: raw }

  - syscalls: [select, _newselect]
    enter:
      reads:
        - { arg: 1, size: 128, offset: 0, type: raw } # readfds
        - { arg: 2, size: 128, offset: 128, type: raw } # writefds
        - { arg: 3, size: 128, offset: 256, type: raw } # exceptfds
        - { arg: 4, size: 16, offset: 384, type: raw } # timeout
    exit:
      reads:
        - { arg: 1, size: 128, offset: 1024, type: raw } # readfds out
        - { arg: 2, size: 128, offset: 1152, type: raw } # writefds out
        - { arg: 3, size: 128, offset: 1280, type: raw } # exceptfds out
        - { arg: 4, size: 16, offset: 1408, type: raw } # timeout out (left)

  - syscalls: [epoll_ctl]
    enter:
      reads: [{ arg: 3, size: 12, offset: 0, type: raw }]

  - syscalls: [epoll_wait, epoll_pwait]
    exit:
      reads: [{ arg: 1, size: 0, offset: 1024, type: raw }]

  # IMPACT: Capture epoll_pwait2 timeout on enter and ready events on exit without user-space memory reads.
  - syscalls: [epoll_pwait2]
    enter:
      reads: [{ arg: 3, size: 16, offset: 512, type: raw }]
    exit:
      reads: [{ arg: 1, size: 0, offset: 1024, type: raw }]

  - syscalls: [rt_sigprocmask]
    enter:
      reads: [{ arg: 1, size: 8, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 2, size: 8, offset: 1024, type: raw }]

  # Keys
  - syscalls: [add_key]
    enter:
      reads:
        - { arg: 0, size: 64, offset: 0, type: string }
        - { arg: 1, size: 128, offset: 64, type: string }
        - { arg: 2, size: 0, offset: 256, type: raw }

  - syscalls: [request_key]
    enter:
      reads:
        - { arg: 0, size: 64, offset: 0, type: string }
        - { arg: 1, size: 128, offset: 64, type: string }
        - { arg: 2, size: 256, offset: 256, type: string }

  # AIO
  - syscalls: [io_setup]
    exit:
      ptr_arg: 1
      reads: [{ arg: 1, size: 8, offset: 1024, type: raw }]

  - syscalls: [arch_prctl]
    enter: { ptr_arg: 1 }
    exit:
      reads: [{ arg: 1, size: 8, offset: 1024, type: raw }]

  # getrlimit
  - syscalls: [getrlimit]
    exit:
      reads: [{ arg: 1, size: 16, offset: 1024, type: raw }]

  # setrlimit
  - syscalls: [setrlimit]
    enter:
      reads: [{ arg: 1, size: 16, offset: 0, type: raw }]

  # prlimit64
  - syscalls: [prlimit64]
    enter:
      reads: [{ arg: 2, size: 16, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 3, size: 16, offset: 1024, type: raw }]

  - syscalls: [sysinfo]
    exit:
      reads: [{ arg: 0, size: 112, offset: 1024, type: raw }]

  - syscalls: [statfs]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 512, type: string }]
    exit:
      reads: [{ arg: 1, size: 120, offset: 1024, type: raw }]

  - syscalls: [fstatfs]
    exit:
      reads: [{ arg: 1, size: 120, offset: 1024, type: raw }]

  # IMPACT: Capture fcntl/fcntl64 lock structs (flock) on enter/exit.
  - syscalls: [fcntl, fcntl64]
    enter:
      reads: [{ arg: 2, size: 0, offset: 0, type: raw }]
    exit:
      reads: [{ arg: 2, size: 0, offset: 1024, type: raw }]

  - syscalls: [rt_sigsuspend]
    enter:
      reads: [{ arg: 0, size: 8, offset: 0, type: raw }]




  # Extended attributes (xattr)
  - syscalls: [setxattr, lsetxattr]
    enter:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 1, size: 256, offset: 512, type: string }
        - { arg: 2, size: 0, offset: 768, type: raw }

  - syscalls: [fsetxattr]
    enter:
      ptr_arg: 1
      reads:
        - { arg: 1, size: 256, offset: 0, type: string }
        - { arg: 2, size: 0, offset: 256, type: raw }

  - syscalls: [getxattr, lgetxattr]
    enter:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 1, size: 256, offset: 512, type: string }
    exit:
      reads:
        - { arg: 2, size: 0, offset: 768, type: raw }

  - syscalls: [fgetxattr]
    enter:
      ptr_arg: 1
      reads:
        - { arg: 1, size: 256, offset: 0, type: string }
    exit:
      reads:
        - { arg: 2, size: 0, offset: 256, type: raw }

  - syscalls: [removexattr, lremovexattr]
    enter:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 1, size: 256, offset: 512, type: string }

  - syscalls: [fremovexattr]
    enter:
      ptr_arg: 1
      reads:
        - { arg: 1, size: 256, offset: 0, type: string }

  - syscalls: [listxattr, llistxattr]
    enter:
      ptr_arg: 0
      reads:
        - { arg: 0, size: 512, offset: 0, type: string }
    exit:
      reads:
        - { arg: 1, size: 0, offset: 512, type: raw }

  - syscalls: [flistxattr]
    exit:
      reads:
        - { arg: 1, size: 0, offset: 0, type: raw }

  # Missing capture rules for failing tests
  - syscalls: [get_robust_list]
    exit:
      reads:
        - { arg: 1, size: 8, offset: 1024, type: raw }
        - { arg: 2, size: 8, offset: 1040, type: raw }

  - syscalls: [waitid]
    exit:
      reads:
        - { arg: 2, size: 128, offset: 1024, type: raw }
        - { arg: 4, size: 144, offset: 1160, type: raw }

  - syscalls: [setitimer]
    enter:
      reads:
        - { arg: 1, size: 32, type: raw }
    exit:
      reads:
        - { arg: 2, size: 32, offset: 1024, type: raw }

  - syscalls: [getitimer]
    exit:
      reads:
        - { arg: 1, size: 32, offset: 1024, type: raw }

  - syscalls: [gettimeofday]
    exit:
      reads:
        - { arg: 0, size: 16, offset: 1024, type: raw }
        - { arg: 1, size: 8, offset: 1048, type: raw }


  - syscalls: [settimeofday]
    enter:
      reads:
        - { arg: 0, size: 16, type: raw }
        - { arg: 1, size: 8, offset: 24, type: raw }
