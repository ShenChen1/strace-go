# Capture rules for strace-go BPF probes.
# offset is the offset within the str_arg[2048] buffer.
# type can be 'string' (bpf_probe_read_user_str) or 'raw' (bpf_probe_read_user).

rules:
  # Path-based syscalls (enter)
  - syscalls: [stat, lstat, open, mkdir, chmod, access, rmdir, chdir, unlink, chown, lchown, chroot, readlink, creat, truncate]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 512, type: string }]
    exit:
      reads: [{ arg: 1, size: 144, offset: 256, type: raw }] # struct stat
  # FD-based fstat
  - syscalls: [fstat]
    exit:
      reads: [{ arg: 1, size: 144, offset: 256, type: raw }]

  # At-based syscalls (enter)
  - syscalls: [newfstatat, openat, mkdirat, chmodat, fchmodat, faccessat, faccessat2, unlinkat, fchownat, readlinkat, linkat, symlinkat]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 512, type: string }]
    exit:
      reads: [{ arg: 2, size: 144, offset: 256, type: raw }] # struct stat

  # Rename syscalls (special case)
  - syscalls: [rename]
    enter:
      reads: 
        - { arg: 0, size: 512, offset: 0, type: string }
        - { arg: 1, size: 512, offset: 1024, type: string }

  - syscalls: [renameat, renameat2]
    enter:
      reads:
        - { arg: 1, size: 512, offset: 0, type: string }
        - { arg: 3, size: 512, offset: 1024, type: string }

  # Network syscalls
  - syscalls: [connect, bind]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 256, offset: 512, type: raw }]

  - syscalls: [accept, accept4]
    enter:
      ptr_arg: 1
      reads: [{ arg: 2, size: 4, offset: 768, type: raw }]
    exit:
      reads:
        - { arg: 1, size: 256, offset: 512, type: raw }
        - { arg: 2, size: 4, offset: 772, type: raw }

  - syscalls: [getsockname, getpeername]
    exit:
      reads:
        - { arg: 1, size: 256, offset: 512, type: raw }
        - { arg: 2, size: 4, offset: 772, type: raw }

  - syscalls: [sendto]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 512, offset: 0, type: raw }]

  - syscalls: [recvfrom]
    exit:
      reads:
        - { arg: 1, size: 512, offset: 0, type: raw }
        - { arg: 4, size: 256, offset: 512, type: raw }
        - { arg: 5, size: 4, offset: 772, type: raw }

  # I/O syscalls
  - syscalls: [read]
    enter: { ptr_arg: 1 }
    exit:
      reads: [{ arg: 1, size: 512, type: raw }]

  - syscalls: [write]
    enter:
      ptr_arg: 1
      reads: [{ arg: 1, size: 512, type: raw }]

  # Event/Multiplexing
  - syscalls: [poll, ppoll]
    enter:
      reads: [{ arg: 0, size: 512, type: raw }]
    exit:
      reads: [{ arg: 0, size: 512, type: raw }]

  - syscalls: [select, pselect6]
    enter:
      reads:
        - { arg: 1, size: 128, offset: 0, type: raw }
        - { arg: 2, size: 128, offset: 128, type: raw }
        - { arg: 3, size: 128, offset: 256, type: raw }
    exit:
      reads:
        - { arg: 1, size: 128, offset: 0, type: raw }
        - { arg: 2, size: 128, offset: 128, type: raw }
        - { arg: 3, size: 128, offset: 256, type: raw }

  - syscalls: [epoll_ctl]
    enter:
      reads: [{ arg: 3, size: 12, type: raw }]

  - syscalls: [epoll_wait, epoll_pwait]
    exit:
      reads: [{ arg: 1, size: 512, type: raw }]

  # Misc
  - syscalls: [ioctl]
    enter:
      reads: [{ arg: 2, size: 128, offset: 512, type: raw }]
    exit:
      reads: [{ arg: 2, size: 128, offset: 512, type: raw }]

  - syscalls: [adjtimex]
    enter:
      reads: [{ arg: 0, size: 256, offset: 512, type: raw }]
    exit:
      reads: [{ arg: 0, size: 256, offset: 512, type: raw }]

  - syscalls: [nanosleep]
    enter:
      ptr_arg: 0
      reads: [{ arg: 0, size: 16, type: raw }]

  - syscalls: [clock_nanosleep]
    enter:
      ptr_arg: 2
      reads: [{ arg: 2, size: 16, type: raw }]

  - syscalls: [gettimeofday]
    exit:
      ptr_arg: 0
      reads: [{ arg: 0, size: 16, type: raw }]

  - syscalls: [clock_gettime]
    exit:
      ptr_arg: 1
      reads: [{ arg: 1, size: 16, type: raw }]

  - syscalls: [getdents64]
    exit:
      reads: [{ arg: 1, size: 512, type: raw }]

  - syscalls: [rt_sigprocmask]
    enter:
      reads: [{ arg: 1, size: 8, type: raw }]

  - syscalls: [arch_prctl]
    enter: { ptr_arg: 1 }
    exit:
      reads: [{ arg: 1, size: 8, offset: 512, type: raw }]
