# Capture rules for strace-go BPF probes.
# offset is the offset within the str_arg[2048] buffer.
# type can be 'string' (bpf_probe_read_user_str) or 'raw' (bpf_probe_read_user).

rules:
  # Path-based syscalls (enter)
  # IMPACT: Added fsopen to capture fs_name path string on enter.
  - syscalls: [open, creat, access, chdir, chroot, chmod, chown, lchown, mkdir, mknod, rmdir, unlink, execve, swapon, swapoff, acct, truncate, fsopen]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, max: 4096 }

  - syscalls: [getcwd]
    exit:
      payloads:
        - { arg: 0, kind: bytes, direction: out, len_from_ret: true, max: 512, offset: 1024 }

  - syscalls: [uname]
    exit:
      payloads:
        - { arg: 0, kind: struct, direction: out, size: 390, offset: 1024 }

  # Syscalls returning struct stat
  - syscalls: [stat, lstat]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, max: 512 }
    exit:
      payloads:
        - { arg: 1, kind: struct, direction: out, size: 144, offset: 1024 }

  # FD-based fstat
  - syscalls: [fstat]
    exit:
      payloads:
        - { arg: 1, kind: struct, direction: out, size: 144, offset: 1024 }

  # pipe/pipe2
  - syscalls: [pipe, pipe2]
    exit:
      payloads:
        - { arg: 0, kind: raw, direction: out, size: 8, offset: 1024 }

  # IMPACT: Capture socketpair fd array on exit so fd tracking does not read tracee memory in user space.
  - syscalls: [socketpair]
    exit:
      payloads:
        - { arg: 3, kind: raw, direction: out, size: 8, offset: 1024 }

  # At-based syscalls (enter)
  # IMPACT: Capture execveat along with other at-based syscalls for path resolution.
  # IMPACT: Added fspick to capture path string on enter.
  - syscalls: [openat, mkdirat, mknodat, chmodat, fchmodat, faccessat, faccessat2, unlinkat, fchownat, execveat, fspick]
    enter:
      payloads:
        - { arg: 1, kind: string, direction: in, max: 4096 }

  - syscalls: [openat2]
    enter:
      payloads:
        - { arg: 1, kind: string, direction: in, max: 4096 }
        - { arg: 2, kind: struct, direction: in, len_from_arg: 3, min: 24, max: 64, offset: 4096 }

  # IMPACT: Set arg 3 (value) size to 4097 to capture complete paths within the 4504 StrArg limit.
  - syscalls: [fsconfig]
    enter:
      payloads:
        - { arg: 2, kind: string, direction: in, size: 257, offset: 0 }
        - { arg: 3, kind: string_or_bytes, direction: in, string_bytes_switch: { selector_arg: 1, bytes_value: 2, len_from_arg: 4, len_mask: 8191 }, max: 4096, offset: 257 }

  - syscalls: [newfstatat]
    enter:
      payloads:
        - { arg: 1, kind: string, direction: in, max: 512 }
    exit:
      payloads:
        - { arg: 2, kind: struct, direction: out, size: 144, offset: 1024 }

  - syscalls: [readlink]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, max: 512 }
    exit:
      payloads:
        - { arg: 1, kind: bytes, direction: out, len_from_ret: true, max: 512, offset: 1024 }

  - syscalls: [readlinkat]
    enter:
      payloads:
        - { arg: 1, kind: string, direction: in, max: 512 }
    exit:
      payloads:
        - { arg: 2, kind: bytes, direction: out, len_from_ret: true, max: 512, offset: 1024 }

  # Dual path syscalls
  - syscalls: [rename, link, symlink]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, max: 512, offset: 0 }
        - { arg: 1, kind: string, direction: in, max: 512, offset: 512 }

  - syscalls: [symlinkat]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, max: 512, offset: 0 }
        - { arg: 2, kind: string, direction: in, max: 512, offset: 512 }

  - syscalls: [renameat, renameat2, linkat]
    enter:
      payloads:
        - { arg: 1, kind: string, direction: in, max: 512, offset: 0 }
        - { arg: 3, kind: string, direction: in, max: 512, offset: 512 }

  # Read/Write buffer capture (small prefix)
  - syscalls: [read, pread64]
    exit:
      payloads:
        - { arg: 1, kind: bytes, direction: out, len_from_ret: true, max: 512, offset: 1024 }

  - syscalls: [write, pwrite64]
    enter:
      payloads:
        - { arg: 1, kind: bytes, direction: in, len_from_arg: 2, max: 512, offset: 0 }

  - syscalls: [readv, writev, preadv, pwritev, preadv2, pwritev2, vmsplice]
    enter:
      payloads:
        - { arg: 1, kind: iovec, direction: in, count_from_arg: 2, elem_size: 16, max: 512, offset: 0 }

  - syscalls: [process_vm_readv, process_vm_writev]
    enter:
      payloads:
        - { arg: 1, kind: iovec, direction: in, count_from_arg: 2, elem_size: 16, max: 512, offset: 0 }
        - { arg: 3, kind: iovec, direction: in, count_from_arg: 4, elem_size: 16, max: 512, offset: 512 }

  - syscalls: [process_madvise]
    enter:
      payloads:
        - { arg: 1, kind: iovec, direction: in, count_from_arg: 2, elem_size: 16, max: 512, offset: 0 }

  # Network
  - syscalls: [connect, bind]
    enter:
      payloads:
        - { arg: 1, kind: struct, direction: in, size: 128, offset: 0 } # sockaddr

  - syscalls: [sendto]
    enter:
      payloads:
        - { arg: 1, kind: raw, direction: in, size: 512, offset: 0 }    # buf
        - { arg: 4, kind: struct, direction: in, size: 128, offset: 512 }  # addr

  - syscalls: [recvfrom]
    enter:
      payloads:
        - { arg: 5, kind: raw, direction: in, size: 4, offset: 768 } # addrlen in
    exit:
      payloads:
        - { arg: 1, kind: raw, direction: out, size: 512, offset: 1024 } # buf
        - { arg: 4, kind: struct, direction: out, len_from_user_arg: 5, clamp_u32_from_offset: 768, max: 128, offset: 1536 } # addr
        - { arg: 5, kind: raw, direction: out, size: 4, offset: 772 }   # addrlen out

  - syscalls: [accept, accept4, getsockname, getpeername]
    enter:
      payloads:
        - { arg: 2, kind: raw, direction: in, size: 4, offset: 768 } # addrlen in
    exit:
      payloads:
        - { arg: 1, kind: struct, direction: out, len_from_user_arg: 2, clamp_u32_from_offset: 768, max: 128, offset: 1024 } # addr out
        - { arg: 2, kind: raw, direction: out, size: 4, offset: 772 } # addrlen out

  - syscalls: [bpf]
    enter:
      payloads:
        - { arg: 1, kind: bytes, direction: in, len_from_arg: 2, max: 512, offset: 0 } # attr

  - syscalls: [ioctl]
    enter:
      payloads:
        - { arg: 2, kind: raw, direction: in, len_from_arg_bits: { arg: 1, shift: 16, mask: 16383, zero_len: 128 }, max: 512, offset: 512 } # arg with dynamic size from cmd (arg 1)
    exit:
      payloads:
        - { arg: 2, kind: raw, direction: out, len_from_arg_bits: { arg: 1, shift: 16, mask: 16383, zero_len: 128 }, max: 512, offset: 1024 }

  - syscalls: [mount]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, size: 512, offset: 0 }
        - { arg: 1, kind: string, direction: in, size: 512, offset: 512 }
        - { arg: 2, kind: string, direction: in, size: 128, offset: 1024 }
        - { arg: 4, kind: string, direction: in, size: 512, offset: 1152 } # data

  - syscalls: [umount2]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, size: 512 }

  - syscalls: [rt_sigaction]
    enter:
      payloads:
        - { arg: 1, kind: struct, direction: in, size: 32, offset: 0 } # act
    exit:
      payloads:
        - { arg: 2, kind: struct, direction: out, size: 32, offset: 1024 } # oact

  - syscalls: [prctl]
    enter:
      payloads:
        - { arg: 1, kind: string, direction: in, size: 16, offset: 0 }
    exit:
      payloads:
        - { arg: 1, kind: raw, direction: out, size: 16, offset: 1024 }

  - syscalls: [clone3]
    enter:
      payloads:
        - { arg: 0, kind: struct, direction: in, len_from_arg: 1, max: 256, offset: 0 } # uargs

  - syscalls: [clock_gettime, clock_getres]
    exit:
      payloads:
        - { arg: 1, kind: struct, direction: out, size: 16, offset: 1024 }

  - syscalls: [gettimeofday]
    exit:
      payloads:
        - { arg: 0, kind: struct, direction: out, size: 16, offset: 1024 }
        - { arg: 1, kind: struct, direction: out, size: 8, offset: 1040 }

  - syscalls: [select, _newselect]
    enter:
      payloads:
        - { arg: 1, kind: raw, direction: in, size: 128, offset: 0 } # readfds
        - { arg: 2, kind: raw, direction: in, size: 128, offset: 128 } # writefds
        - { arg: 3, kind: raw, direction: in, size: 128, offset: 256 } # exceptfds
        - { arg: 4, kind: struct, direction: in, size: 16, offset: 384 } # timeout
    exit:
      payloads:
        - { arg: 1, kind: raw, direction: out, size: 128, offset: 1024 } # readfds out
        - { arg: 2, kind: raw, direction: out, size: 128, offset: 1152 } # writefds out
        - { arg: 3, kind: raw, direction: out, size: 128, offset: 1280 } # exceptfds out
        - { arg: 4, kind: struct, direction: out, size: 16, offset: 1408 } # timeout out (left)

  - syscalls: [rt_sigprocmask]
    enter:
      payloads:
        - { arg: 1, kind: raw, direction: in, size: 8, offset: 0 }
    exit:
      payloads:
        - { arg: 2, kind: raw, direction: out, size: 8, offset: 1024 }

  # Keys
  - syscalls: [add_key]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, max: 64, offset: 0 }
        - { arg: 1, kind: string, direction: in, max: 128, offset: 64 }
        - { arg: 2, kind: bytes, direction: in, len_from_arg: 3, max: 256, offset: 256 }

  - syscalls: [request_key]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, size: 64, offset: 0 }
        - { arg: 1, kind: string, direction: in, size: 128, offset: 64 }
        - { arg: 2, kind: string, direction: in, size: 256, offset: 256 }

  # getrlimit
  - syscalls: [getrlimit]
    exit:
      payloads:
        - { arg: 1, kind: struct, direction: out, size: 16, offset: 1024 }

  # setrlimit
  - syscalls: [setrlimit]
    enter:
      payloads:
        - { arg: 1, kind: struct, direction: in, size: 16, offset: 0 }

  # prlimit64
  - syscalls: [prlimit64]
    enter:
      payloads:
        - { arg: 2, kind: struct, direction: in, size: 16, offset: 0 }
    exit:
      payloads:
        - { arg: 3, kind: struct, direction: out, size: 16, offset: 1024 }

  - syscalls: [sysinfo]
    exit:
      payloads:
        - { arg: 0, kind: struct, direction: out, size: 112, offset: 1024 }

  - syscalls: [statfs]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, size: 512 }
    exit:
      payloads:
        - { arg: 1, kind: struct, direction: out, size: 120, offset: 1024 }

  - syscalls: [fstatfs]
    exit:
      payloads:
        - { arg: 1, kind: struct, direction: out, size: 120, offset: 1024 }

  # IMPACT: Capture fcntl/fcntl64 lock structs (flock) on enter/exit.
  - syscalls: [fcntl, fcntl64]
    enter:
      payloads:
        - { arg: 2, kind: raw, direction: in, len_from_arg_cases: { arg: 1, cases: [{ size: 8, values: [15, 16, 1035, 1036, 1037, 1038, 1039, 1040, 1043, 1044, 19, 20, 21, 22, 23, 24] }, { size: 32, values: [5, 6, 7, 12, 13, 14, 36, 37, 38] }] }, max: 32, offset: 0 }
    exit:
      payloads:
        - { arg: 2, kind: raw, direction: out, len_from_arg_cases: { arg: 1, cases: [{ size: 8, values: [15, 16, 1035, 1036, 1037, 1038, 1039, 1040, 1043, 1044, 19, 20, 21, 22, 23, 24] }, { size: 32, values: [5, 6, 7, 12, 13, 14, 36, 37, 38] }] }, max: 32, offset: 1024 }

  - syscalls: [rt_sigsuspend]
    enter:
      payloads:
        - { arg: 0, kind: raw, direction: in, size: 8, offset: 0 }




  # Extended attributes (xattr)
  - syscalls: [setxattr, lsetxattr]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, max: 512, offset: 0 }
        - { arg: 1, kind: string, direction: in, max: 256, offset: 512 }
        - { arg: 2, kind: bytes, direction: in, len_from_arg: 3, max: 256, offset: 768 }

  - syscalls: [fsetxattr]
    enter:
      payloads:
        - { arg: 1, kind: string, direction: in, max: 256, offset: 0 }
        - { arg: 2, kind: bytes, direction: in, len_from_arg: 3, max: 256, offset: 256 }

  - syscalls: [getxattr, lgetxattr]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, max: 512, offset: 0 }
        - { arg: 1, kind: string, direction: in, max: 256, offset: 512 }
    exit:
      payloads:
        - { arg: 2, kind: bytes, direction: out, len_from_arg: 3, max: 256, offset: 768 }

  - syscalls: [fgetxattr]
    enter:
      payloads:
        - { arg: 1, kind: string, direction: in, max: 256, offset: 0 }
    exit:
      payloads:
        - { arg: 2, kind: bytes, direction: out, len_from_arg: 3, max: 256, offset: 256 }

  - syscalls: [removexattr, lremovexattr]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, max: 512, offset: 0 }
        - { arg: 1, kind: string, direction: in, max: 256, offset: 512 }

  - syscalls: [fremovexattr]
    enter:
      payloads:
        - { arg: 1, kind: string, direction: in, max: 256, offset: 0 }

  - syscalls: [listxattr, llistxattr]
    enter:
      payloads:
        - { arg: 0, kind: string, direction: in, max: 512, offset: 0 }
    exit:
      payloads:
        - { arg: 1, kind: bytes, direction: out, len_from_arg: 2, max: 256, offset: 512 }

  - syscalls: [flistxattr]
    exit:
      payloads:
        - { arg: 1, kind: bytes, direction: out, len_from_arg: 2, max: 256, offset: 0 }

  - syscalls: [waitid]
    exit:
      payloads:
        - { arg: 2, kind: struct, direction: out, size: 128, offset: 1024 }
        - { arg: 4, kind: struct, direction: out, size: 144, offset: 1160 }
