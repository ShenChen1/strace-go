name: native-architecture

on:
  push:
  pull_request:

jobs:
  build-and-unit:
    name: ${{ matrix.arch }} native build and unit tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-26.04-arm
            machine: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Verify native runner architecture
        env:
          EXPECTED_GOARCH: ${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(go env GOOS)" = linux
          test "$(go env GOHOSTARCH)" = "$EXPECTED_GOARCH"
          test "$(uname -m)" = "$EXPECTED_MACHINE"
      - name: Install BPF and userspace test tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - name: Check generated syscall metadata
        run: GOCACHE=/tmp/strace-go-gocache make check-metadata
      - name: Generate target BPF artifacts
        run: GOCACHE=/tmp/strace-go-gocache make generate-bpf ARCH=${{ matrix.arch }}
      - name: Ensure generation is clean
        run: git diff --exit-code
      - name: Build target userspace
        run: GOCACHE=/tmp/strace-go-gocache make build ARCH=${{ matrix.arch }}
      - name: Run target unit tests
        run: GOCACHE=/tmp/strace-go-gocache make test ARCH=${{ matrix.arch }}

  amd64-semantic:
    name: amd64 privileged eBPF semantic suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install BPF test tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - name: Build amd64 tracer
        run: GOCACHE=/tmp/strace-go-gocache make build ARCH=amd64
      - name: Run privileged semantic suite
        run: sudo -n python3 test/run_tests.py --suite ebpf-semantic --skip-build
